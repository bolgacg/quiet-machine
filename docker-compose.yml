# The whole kit. `docker compose up -d --build`, then open Grafana on :3000
# and run `python tools/prove.py` from the host to watch every alert fire.
services:
  nats:
    image: nats:2.14.6-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222"]
    volumes: ["nats-data:/data"]

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/otelcol.yaml"]
    volumes: ["./collector/otelcol.yaml:/etc/otelcol/otelcol.yaml:ro"]
    ports: ["4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: ["./prometheus:/etc/prometheus:ro", "prom-data:/prometheus"]
    ports: ["9090:9090"]
    depends_on: [otelcol, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.34.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
    depends_on: [sink]

  sink:
    build: .
    command: ["python", "services/sink.py"]
    environment: {QM_LEDGER: /data/alerts.ledger.jsonl}
    volumes: ["sink-data:/data"]
    ports: ["9095:9095"]

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: quiet-machine
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      QM_PROM_URL: http://prometheus:9090
      QM_DASH_DIR: /var/lib/grafana/dashboards
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  bridge:
    build: .
    command: ["python", "services/bridge.py"]
    environment: {QM_NATS_URL: "nats://nats:4222", QM_OTLP_URL: "http://otelcol:4318"}
    depends_on: [nats, otelcol]

  collector-a:
    build: .
    environment: {QM_SERVICE: collector-a, QM_NATS_URL: "nats://nats:4222", QM_MODE: live, QM_STATUS_PORT: "9101"}
    ports: ["9101:9101"]
    depends_on: [nats]

  collector-b:
    build: .
    environment: {QM_SERVICE: collector-b, QM_NATS_URL: "nats://nats:4222", QM_MODE: live, QM_STATUS_PORT: "9102"}
    ports: ["9102:9102"]
    depends_on: [nats]

volumes:
  nats-data: {}
  prom-data: {}
  sink-data: {}
