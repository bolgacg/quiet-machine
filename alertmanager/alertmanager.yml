# One route, one receiver: everything goes to the ledger. Grouping is by alert
# and service so a page names what is wrong and where; repeat is an hour so a
# standing fault is re-announced, not forgotten.
route:
  receiver: ledger
  group_by: [alertname, service_name, subject_service]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: ledger
    webhook_configs:
      - url: http://sink:9095/alerts
        send_resolved: true
